name: Windows build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: |
          choco install ninja -y
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue

      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Patch ZAPD WHOLEARCHIVE link path (PAL)
        run: |
          $f = "ZAPDTR/ZAPD/CMakeLists.txt"
          $c = [System.IO.File]::ReadAllText($f)
          $old = '-WHOLEARCHIVE:$<TARGET_LINKER_FILE_DIR:OTRExporter>/$<TARGET_LINKER_FILE_NAME:OTRExporter>'
          $new = '-WHOLEARCHIVE:$<IF:$<CONFIG:Debug>,../x64/Debug/OTRExporter.lib,build-artifacts/lib/OTRExporter.lib>'
          if ($c.Contains($old)) {
            $c = $c.Replace($old, $new)
            [System.IO.File]::WriteAllText($f, $c)
            Write-Host "Patched ZAPD WHOLEARCHIVE path."
          } else {
            Write-Host "WHOLEARCHIVE line already patched or not found; skipping."
          }

      - name: Install Python build dependencies
        run: python -m pip install -r tools/ml64pak_converter/requirements-build.txt

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          max-size: "2G"
          evict-old-files: job
          save: ${{ github.ref_name == github.event.repository.default_branch }}
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache

      - name: Restore Cached VCPKG folder
        id: restore-cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ github.ref }}-
            ${{ runner.os }}-vcpkg-
          path: vcpkg

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build-windows --target Generate2ShipOtr --config Release --parallel 10
          cmake --build build-windows --config Release --parallel 10
          Push-Location build-windows
          cpack
          Pop-Location
          Get-ChildItem .\_packages -Filter *.zip | Move-Item -Destination .\_packages\2ship-windows.zip

      - name: Unzip package
        run: Expand-Archive -Path .\_packages\2ship-windows.zip -DestinationPath .\2ship-windows

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: 2ship-windows
          path: 2ship-windows

      - name: Save Cache VCPKG folder
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
          path: vcpkg
